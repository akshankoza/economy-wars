ding:14px;border-radius:11px;outline:none}.field input:focus{border-color:var(--aqua)}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:800;background:var(--aqua);color:#061622;transition:transform .2s,filter .2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.09)}.btn.alt{background:#263857;color:#e9f4ff}.btn.rose{background:var(--rose);color:#16101a}.btn.gold{background:var(--gold);color:#271d10}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;background:#213650;color:var(--aqua);font-size:12px;font-weight:800}.light{color:var(--muted)}.metric{background:#0e182a;border:1px solid #263954;padding:20px;border-radius:15px}.metric small{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.metric strong{display:block;font:700 31px 'Space Grotesk';margin-top:6px}.metric span{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.country{font:700 39px 'Space Grotesk';letter-spacing:-.04em}.choice{padding:17px;border:1px solid #334664;border-radius:15px;background:#111f35;cursor:pointer;transition:.2s;min-height:130px}.choice:hover{border-color:var(--aqua);background:#162b3b}.choice.selected{border:2px solid var(--aqua);background:#15343b}.choice b{display:block;margin-bottom:9px;font-size:16px}.choice p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.event{border:1px solid #5a4a37;background:linear-gradient(110deg,#332b27,#1e2b38);border-radius:16px;padding:22px}.event .eyebrow{color:var(--gold)}.event h2{margin:10px 0}.event p{margin:0;color:#e6d5bb}.progress{height:9px;background:#30415b;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#4ad9c2,#a7ffdb);width:0%;transition:width .5s}.board{width:100%;border-collapse:collapse}.board th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:12px}.board td{padding:14px 12px;border-top:1px solid #293b53;font-size:14px}.board tr:first-child td{color:var(--gold)}.board td strong{font-size:16px}.code{font:700 32px 'Space Grotesk';letter-spacing:.18em;color:var(--aqua)}.hidden{display:none!important}.notice{border:1px solid #49607c;border-radius:13px;background:#16273c;padding:13px 16px;color:#b8d4ee;font-size:13px;line-height:1.5}.danger{color:var(--rose)}.tiny{font-size:12px;color:var(--muted)}.roundtrack{display:flex;gap:6px;margin:15px 0}.roundtrack i{height:6px;border-radius:10px;background:#2d405c;flex:1}.roundtrack i.done{background:var(--aqua)}.footer{text-align:center;margin-top:45px;color:#627891;font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:13px 19px;background:#ffe1a1;color:#172136;border-radius:12px;box-shadow:0 10px 40px #0006;font-weight:700;z-index:10;max-width:90vw}.labelLine{display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px}.effect{font-size:12px;color:var(--aqua);margin-top:10px}.spinner{display:inline-block;width:9px;height:9px;background:#64ebce;border-radius:50%;box-shadow:0 0 12px #64ebce}.mini{padding:10px;background:#122136;border-radius:11px;margin:8px 0;font-size:13px}.flag{font-size:28px} @media(max-width:800px){.half,.third,.twoThird{grid-column:span 12}.metrics{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}.hero{padding-top:25px}.shell{padding:18px 14px 50px}.pane{padding:18px}.board th,.board td{padding:9px 6px;font-size:11px}.mark{font-size:16px}}

const appDiv=document.getElementById('app');let auth,db,uid=null,room=null,role=null,me=null,game=null,unsub=null,selection=null;const rounds=5;

[{id:'industry',name:'🏭 Industrial Expansion',desc:'Subsidise factories and infrastructure. Faster production, but a strained fiscal budget.',delta:{growth:4,budget:-9,inflation:2,trade:3,happiness:1}},{id:'welfare',name:'🏥 Social Safety Net',desc:'Boost healthcare and public support. Households recover, though the state spends more.',delta:{growth:1,budget:-7,inflation:-1,happiness:9,trade:0}},{id:'reform',name:'📊 Fiscal Discipline',desc:'Cut waste and improve tax collection. Strong finances, slower short-run growth.',delta:{growth:-1,budget:10,inflation:-2,happiness:-3,trade:1}}],
[{id:'subsidy',name:'⛽ Energy Subsidy',desc:'Shield consumers from fuel inflation at a substantial fiscal cost.',delta:{growth:2,budget:-10,inflation:-5,happiness:7,trade:0}},{id:'green',name:'🌿 Renewable Transition',desc:'Invest in clean energy. Costly today, but stronger resilience and global demand.',delta:{growth:2,budget:-7,inflation:-1,happiness:3,trade:7}},{id:'rates',name:'🏦 Raise Interest Rates',desc:'Fight inflation with tighter monetary policy. May slow growth and employment.',delta:{growth:-3,budget:3,inflation:-6,happiness:-3,trade:1}}],
[{id:'tariffs',name:'🧱 Retaliatory Tariffs',desc:'Protect domestic firms while risking higher prices and reduced trade.',delta:{growth:1,budget:6,inflation:4,happiness:-3,trade:-9}},{id:'deals',name:'🤝 Trade Diplomacy',desc:'Negotiate market access and diversify trading partners.',delta:{growth:3,budget:-4,inflation:-1,happiness:2,trade:10}},{id:'self',name:'🔧 Domestic Supply Chains',desc:'Invest in production independence. More resilient, but expensive.',delta:{growth:2,budget:-8,inflation:1,happiness:3,trade:4}}],

function clamp(x,min,max){return Math.max(min,Math.min(max,x))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let n=document.getElementById('toast');n.textContent=s;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3500)}
function initial(){return {growth:5,inflation:4,budget:65,happiness:65,trade:50}}function score(s){return Math.round(s.growth*8 + s.budget*.8+s.happiness*1.2+s.trade*.8-Math.abs(s.inflation-3)*6)}function resolve(s,delta,event){let o={...s};for(let k of Object.keys(o))o[k]+=((event.impact||{})[k]||0)+(delta[k]||0);o.growth=clamp(o.growth,-12,20);o.inflation=clamp(o.inflation,-3,24);for(let k of ['budget','happiness','trade'])o[k]=clamp(o[k],0,100);return o}
function setup(){if(firebaseConfig.apiKey.startsWith('PASTE')){appDiv.innerHTML=`<div class="pane"><h2>⚙️ One-time Firebase configuration needed</h2><p class="sub">The downloadable game is complete, but live multiplayer needs your free Firebase project credentials. Follow <b>SETUP.md</b>, then replace the configuration inside <b>index.html</b>. The game works across laptops once hosted.</p><div class="notice">Demo preview is available below, without live rooms or multiplayer.</div><p><button class="btn" id="demo">Open UI demo</button></p></div>`;document.getElementById('demo').onclick=demo;return}try{const fb=initializeApp(firebaseConfig);auth=getAuth(fb);db=getDatabase(fb);onAuthStateChanged(auth,u=>{if(u){uid=u.uid;let saved=JSON.parse(localStorage.getItem('ewSession')||'null');if(saved){room=saved.room;role=saved.role;listen()}else home()}});signInAnonymously(auth).catch(e=>appDiv.innerHTML=`<div class="notice danger">Sign-in failed: ${esc(e.message)}. Enable Anonymous authentication in Firebase.</div>`)}catch(e){appDiv.textContent=e.message}}
function home(){appDiv.innerHTML=`<section class="hero"><div class="eyebrow">BUILD • TRADE • SURVIVE • WIN</div><h1>THE WORLD<br>IS <em>YOURS.</em></h1><p class="lead">Run a country. Make impossible economic decisions. Watch markets react in real time. Can you build the most prosperous nation in the room?</p></section><div class="grid"><section class="pane half"><span class="eyebrow">For event organisers</span><h2 style="margin-top:13px">Command the world</h2><p class="sub">Start a live event, control each economic round, trigger world shocks and display the leaderboard on a projector.</p><label class="field">Host / club name<input id="host" maxlength="40" placeholder="e.g. ArthaNiti Economics Club"/></label><button class="btn" id="create">Create live arena →</button></section><section class="pane half"><span class="eyebrow">For participants</span><h2 style="margin-top:13px">Enter the arena</h2><p class="sub">Join from your own laptop. Name your nation, debate economic policy and compete against other teams.</p><label class="field">6-character game code<input id="code" maxlength="6" placeholder="e.g. XM73KQ" style="text-transform:uppercase"/></label><label class="field">Country / team name<input id="team" maxlength="30" placeholder="e.g. Republic of Nova"/></label><button class="btn gold" id="join">Join competition →</button></section></div>`;document.getElementById('create').onclick=create;document.getElementById('join').onclick=join}
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function makeCode(){return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
async function create(){let name=document.getElementById('host').value.trim()||'ArthaNiti Economics Club';let id=makeCode();await set(ref(db,`rooms/${id}`),{host:uid,hostName:name,phase:'lobby',round:0,created:Date.now(),players:{}});room=id;role='host';localStorage.setItem('ewSession',JSON.stringify({room,role}));listen()}
async function join(){let id=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('team').value.trim();if(!/^[A-Z2-9]{6}$/.test(id)||name.length<2)return toast('Enter a valid six-character code and country name.');let snap=await get(ref(db,`rooms/${id}`));if(!snap.exists())return toast('Arena not found. Check your code.');let g=snap.val();if(g.phase!=='lobby')return toast('This event has already started.');let players=g.players||{};if(Object.values(players).some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('Country name already taken.');if(Object.keys(players).length>=60)return toast('Arena is full (60 countries maximum).');await set(ref(db,`rooms/${id}/players/${uid}`),{name,stats:initial(),decisions:{},history:{},joined:Date.now()});room=id;role='player';localStorage.setItem('ewSession',JSON.stringify({room,role}));listen()}
function listen(){if(unsub)unsub();unsub=onValue(ref(db,`rooms/${room}`),snap=>{if(!snap.exists()){leave();return}game=snap.val();if(role==='host'&&game.host!==uid){leave();return}me=game.players?.[uid];if(role==='player'&&!me){leave();return}render()},e=>toast('Connection error: '+e.message))}
function leave(){if(unsub){unsub();unsub=null}localStorage.removeItem('ewSession');room=null;role=null;game=null;me=null;home()}
function header(){return `<div class="row between" style="margin-bottom:22px"><div><span class="eyebrow">ARENA ${esc(room)}</span><h2 style="font:700 27px 'Space Grotesk';margin:7px 0">${esc(game.hostName||'Economy Wars')}</h2></div><div class="row"><span class="pill">${Object.keys(game.players||{}).length} NATIONS CONNECTED</span><button class="btn alt" id="exit">Exit device</button></div></div>`}
function tracker(){return `<div class="roundtrack">${Array.from({length:rounds},(_,i)=>`<i class="${i<game.round?'done':''}"></i>`).join('')}</div>`}
function ranking(){let a=Object.entries(game.players||{}).map(([id,p])=>({id,...p,points:score(p.stats)})).sort((a,b)=>b.points-a.points);return `<table class="board"><thead><tr><th>Rank</th><th>Nation</th><th>Prosperity</th><th>Growth</th><th>Public support</th></tr></thead><tbody>${a.map((p,i)=>`<tr><td>${i===0?'👑 ':''}#${i+1}</td><td><strong>${esc(p.name)}</strong>${p.id===uid?' <span class="tiny">(you)</span>':''}</td><td><strong>${p.points}</strong></td><td>${p.stats.growth.toFixed(1)}%</td><td>${p.stats.happiness}/100</td></tr>`).join('')}</tbody></table>`}
function metrics(s){let a=[['GDP growth',`${s.growth.toFixed(1)}%`,'Annualised growth'],['Inflation',`${s.inflation.toFixed(1)}%`,'Lower is usually better'],['Fiscal reserves',`${s.budget}/100`,'Government capacity'],['Citizen happiness',`${s.happiness}/100`,'Social welfare'],['Trade strength',`${s.trade}/100`,'International position'],['Prosperity score',score(s),'Overall performance']];return `<div class="metrics" style="grid-template-columns:repeat(auto-fit,minmax(145px,1fr))">${a.map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div>`}
function render(){if(!game)return;let players=Object.values(game.players||{}),r=game.round,phase=game.phase;let body='';if(role==='host'){
let submitted=players.filter(p=>p.decisions?.[r]!==undefined).length;body=`${header()}<div class="grid"><div class="twoThird pane"><div class="row between"><span class="eyebrow">MISSION CONTROL</span><span class="pill">${phase.toUpperCase()}</span></div><h2 style="font-size:34px;margin-top:15px">${phase==='lobby'?'Your world is assembling':phase==='finished'?'The world has a winner':`ROUND ${r} · ${names[r-1]}`}</h2>${tracker()}${phase==='lobby'?`<p class="sub">Display this join code on the projector. Players choose their own country names and appear here instantly.</p><p class="eyebrow">JOIN CODE</p><div class="code">${room}</div><p class="sub">${players.length} of 60 possible nations registered</p><button class="btn" id="start" ${players.length<2?'disabled':''}>Start world simulation →</button>`:phase==='decision'?`<div class="event"><span class="eyebrow">⚡ GLOBAL BREAKING NEWS</span><h2>${events[r-1].name}</h2><p>${events[r-1].desc}</p></div><div class="row between" style="margin:20px 0 10px"><b>Countries ready: ${submitted} / ${players.length}</b><span class="tiny">Advance when all teams submit, or end early</span></div><div class="progress"><i style="width:${players.length?submitted/players.length*100:0}%"></i></div><p style="margin-top:22px"><button class="btn gold" id="resolve">Reveal results & apply shock →</button></p>`:phase==='results'?`<p class="sub">The round has ended. All policy outcomes have been applied. Discuss winners and trade-offs before moving on.</p><div class="notice">${esc(game.lastSummary||'Economic results published.')}</div><p style="margin-top:22px"><button class="btn" id="next">${r===rounds?'Announce champions →':'Launch next round →'}</button></p>`:`<p class="sub">Final results are in. Celebrate the strongest economy, then discuss the policy trade-offs that shaped the outcome.</p><button class="btn alt" id="reset">Start a fresh arena</button>`}</div><div class="third pane"><h3>🛰️ World status</h3><div class="mini">📍 Arena: <b>${room}</b></div><div class="mini">🌐 Connected nations: <b>${players.length}</b></div><div class="mini">⏳ Round: <b>${r}/${rounds}</b></div><div class="mini">🗳️ Choices submitted: <b>${phase==='decision'?submitted+'/'+players.length:'—'}</b></div><p class="tiny">Tip: Share this screen on a projector. The ranking below updates live across devices.</p><div class="notice">Host controls are visible only to the creator. For fair play, don't share the host's browser session.</div></div><div class="full pane"><h2>🏆 Live world rankings</h2>${players.length?ranking():'<p class="sub">Waiting for countries to arrive.</p>'}</div></div>`;
}else{let s=me.stats,submitted=me.decisions?.[r]!==undefined;body=`${header()}<div class="grid"><div class="full pane"><div class="row between"><div><div class="eyebrow">YOUR NATION</div><div class="country">🌐 ${esc(me.name)}</div></div><span class="pill">${phase==='lobby'?'WAITING IN LOBBY':phase==='finished'?'GAME COMPLETE':`ROUND ${r} OF ${rounds}`}</span></div>${tracker()}${metrics(s)}</div>${phase==='lobby'?`<div class="full pane"><h2>🌎 The summit begins soon</h2><p class="sub">You are connected. The host will start the simulation once all countries have joined. Meanwhile, discuss how you will balance growth, fiscal strength, inflation and citizens' wellbeing.</p></div>`:phase==='decision'?`<div class="full event"><span class="eyebrow">⚡ BREAKING WORLD EVENT</span><h2>${events[r-1].name}</h2><p>${events[r-1].desc}</p></div><div class="full pane"><div class="row between"><div><span class="eyebrow">CABINET MEETING</span><h2 style="margin:8px 0 5px">Choose your national policy</h2></div><span class="pill">ONE POLICY • ONE VOTE</span></div><p class="sub">Every decision changes GDP growth, inflation, budget reserves, public happiness and trade strength. Policies interact with the global crisis. Choose carefully!</p>${submitted?`<div class="notice" style="margin-top:18px">✅ Policy submitted: <strong>${esc((policies[r-1].find(p=>p.id===me.decisions[r])||{}).name||'No action')}</strong>. Waiting for the host to reveal results.</div>`:`<div class="choices" style="margin:22px 0">${policies[r-1].map(p=>`<div class="choice ${selection===p.id?'selected':''}" data-policy="${p.id}"><b>${p.name}</b><p>${p.desc}</p></div>`).join('')}</div><button class="btn" id="vote" ${selection?'':'disabled'}>Lock in government decision →</button><span class="tiny" style="margin-left:10px">Decisions become final when submitted.</span>`}</div>`:phase==='results'?`<div class="full pane"><span class="eyebrow">ECONOMIC BULLETIN</span><h2 style="margin:12px 0">Round ${r} outcomes are live</h2><p class="sub">${events[r-1].tip} Your updated indicators are above. Use the leaderboard to assess where you stand.</p><div class="notice">${esc(game.lastSummary||'The global economic shock has been applied.')}</div></div>`:`<div class="full pane"><span class="eyebrow">FINAL REPORT</span><h2>Your nation's final prosperity score: ${score(s)}</h2><p class="sub">Economic development is a balancing act. Strong growth alone may not create the most resilient society.</p></div>`}<div class="full pane"><h2>🏆 Global prosperity leaderboard</h2>${ranking()}</div></div>`}
appDiv.innerHTML=body;document.getElementById('exit')?.addEventListener('click',leave);document.getElementById('start')?.addEventListener('click',()=>update(ref(db,`rooms/${room}`),{phase:'decision',round:1}));document.getElementById('resolve')?.addEventListener('click',resolveRound);document.getElementById('next')?.addEventListener('click',()=>update(ref(db,`rooms/${room}`),r===rounds?{phase:'finished'}:{phase:'decision',round:r+1}));document.getElementById('reset')?.addEventListener('click',leave);document.querySelectorAll('[data-policy]').forEach(e=>e.onclick=()=>{selection=e.dataset.policy;render()});document.getElementById('vote')?.addEventListener('click',vote)}
async function vote(){if(!selection||game.phase!=='decision'||role!=='player'||!policies[game.round-1].some(x=>x.id===selection))return;let p=selection,round=game.round;try{await runTransaction(ref(db,`rooms/${room}/players/${uid}/decisions/${round}`),old=>old===null?p:undefined,{applyLocally:false});selection=null;toast('Government decision locked in!')}catch(e){toast(e.message)}}
async function resolveRound(){if(role!=='host'||game.phase!=='decision')return;let r=game.round;let updates={};let all=Object.entries(game.players||{});for(let [id,p] of all){let decision=p.decisions?.[r],policy=policies[r-1].find(x=>x.id===decision);let stats=resolve(p.stats,policy?.delta||{},events[r-1]);updates[`players/${id}/stats`]=stats;updates[`players/${id}/history/${r}`]={choice:policy?.name||'No action',score:score(stats)};}updates.phase='results';updates.lastSummary=`Round ${r}: ${events[r-1].name}. ${all.filter(([,p])=>p.decisions?.[r]!==undefined).length} of ${all.length} countries submitted a policy. Others absorbed the crisis without a response.`;try{await update(ref(db,`rooms/${room}`),updates)}catch(e){toast(e.message)}}
function demo(){room='DEMO42';role='player';me={name:'Republic of Nova',stats:initial(),decisions:{},history:{}};game={hostName:'ArthaNiti Economics Club',phase:'decision',round:2,players:{demo:me,other:{name:'The United Isles',stats:{growth:7,inflation:6,budget:58,happiness:70,trade:62},decisions:{}}}};uid='demo';appDiv.innerHTML='';render();document.getElementById('exit').onclick=()=>setup();document.getElementById('vote')?.addEventListener('click',()=>toast('Preview only. Configure Firebase to enable live gameplay.'))}
setup();
